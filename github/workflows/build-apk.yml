name: Build Marine Navigator HD

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q Marine_Navigator_HD_v1_Source.zip

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          build-root-directory: MarineNavigatorHD
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marine-Navigator-HD
          path: MarineNavigatorHD/app/build/outputs/apk/debug/app-debug.apk
